<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meus estudos web </title>

    <style>
        body{
            font-family: Arial, sans-serif;

        }

        .campo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input {
            padding: 8px; 
        }

        button {
            padding: 10px;
        }

        #nome {
            border: 2px solid blue;
        }

        #categoria {
            border: 2px solid green;
        }

        button:hover {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Cadastro de cursos</h1>
    <p>Preencha os dados para cadastrar um curso</p>

    <form id="cursoForm"> <!--Agrupa os campos de um formulário.-->

        <div class="campo">
        <label for="nome">Nome do curso: </label> <!--	Define o rótulo que identifica o campo.-->
        <input type="text" id="nome" name="nome" required> <!--	Identifica esse elemento na página-->
        </div>

        <div class="campo">
        <label for="cargaHoraria">Carga horaria</label>
        <input type="number" id="cargaHoraria" name="cargaHoraria" required min="1">
        </div>

        <div class="campo">
        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" name="categoria" required>
        </div>

        <button type="submit">Cadastrar Curso</button>
        <button type="button" id="carregarCurso">Carregar curso do arquivo</button>

    </form>
    <p id="resultado"></p>

    <script src="script.js"> </script>
</body>
</html>
